<div data-personal-subcategory>
  <label>Personal subcategory
    <select name="{{ category_field|default('subcategory') }}" data-category-select>
      <option value="">No subcategory</option>
      {% for category in subcategories %}<option value="{{ category }}" {% if category == category_value|default('') %}selected{% endif %}>{{ category }}</option>{% endfor %}
      <option value="" data-new-category>+ Add new subcategory…</option>
    </select>
  </label>
  <label data-new-category-label hidden>New subcategory name
    <input data-new-category-input maxlength="80" placeholder="e.g. Books" disabled>
  </label>
</div>
