<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Joint Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v=5">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Joint Expense Tracker</a>
      <nav>
        {% for href, label in [("/", "Dashboard"), ("/spending", "Spending"), ("/transactions", "Transactions"), ("/accounts", "Accounts"), ("/rules", "Rules"), ("/settings", "Settings")] %}
        <a href="{{ href }}" {% if request.url.path == href %}aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
