{% extends "base.html" %}
{% block content %}
<section class="page-head"><div><h1>Edit Transaction</h1><p>{{ transaction.transaction_datetime }}</p></div></section>
<form class="edit-form" method="post" data-amount="{{ transaction.amount }}">
  <label>Merchant <input name="merchant" value="{{ transaction.merchant }}"></label>
  <label>Card/account name <input name="account_name" value="{{ transaction.account_name or '' }}" placeholder="Chase Sapphire Preferred Visa"></label>
  <input type="hidden" name="card_last4" value="{{ transaction.card_last4 or '' }}">
  <label>Status
    <select name="status">{% for status in statuses %}<option value="{{ status }}" {% if transaction.status == status %}selected{% endif %}>{{ "Present" if status == "Wife" else status }}</option>{% endfor %}</select>
  </label>
  <label>Original amount <input readonly value="${{ '%.2f'|format(transaction.amount) }}"></label>
  <label>Tip percent <input id="tip_percent" name="tip_percent" type="number" inputmode="decimal" step="0.01" min="0" max="100" value="{{ transaction.tip_percent or '' }}"></label>
  <label>Tip amount <input id="tip_amount" name="tip_amount" type="number" inputmode="decimal" step="0.01" min="0" value="{{ '%.2f'|format(transaction.tip_amount or 0) if transaction.tip_amount else '' }}"></label>
  <label>Joint amount <input name="joint_amount" type="number" step="0.01" min="0" value="{{ transaction.joint_amount }}"></label>
  <label>Note <input name="note" value="{{ transaction.note or '' }}"></label>
  <label>Raw text <textarea readonly>{{ transaction.raw_text }}</textarea></label>
  <div class="actions"><button>Save</button><a href="/transactions">Cancel</a></div>
</form>
<script>
  const form = document.querySelector(".edit-form");
  const amount = Number(form.dataset.amount || "0");
  const tipPercent = document.querySelector("#tip_percent");
  const tipAmount = document.querySelector("#tip_amount");
  const jointAmount = document.querySelector('input[name="joint_amount"]');
  const status = document.querySelector('select[name="status"]');

  function money(value) {
    return Number.isFinite(value) ? value.toFixed(2) : "";
  }

  function percent(value) {
    return Number.isFinite(value) ? value.toFixed(2) : "";
  }

  function updateJointTotalForCurrentStatus() {
    const tip = Number(tipAmount.value || "0");
    if (status.value === "Joint" || status.value === "Her") {
      jointAmount.value = money(amount + tip);
    }
  }

  function fromPercent() {
    const pct = Number(tipPercent.value);
    tipAmount.value = tipPercent.value === "" ? "" : money(amount * pct / 100);
    updateJointTotalForCurrentStatus();
  }

  function fromAmount() {
    const tip = Number(tipAmount.value);
    tipPercent.value = tipAmount.value === "" || amount <= 0 ? "" : percent((tip / amount) * 100);
    updateJointTotalForCurrentStatus();
  }

  ["input", "change", "keyup"].forEach((eventName) => {
    tipPercent.addEventListener(eventName, fromPercent);
    tipAmount.addEventListener(eventName, fromAmount);
  });

  status.addEventListener("change", () => {
    if (status.value === "Joint" || status.value === "Her") {
      updateJointTotalForCurrentStatus();
    }
  });
</script>
{% endblock %}
